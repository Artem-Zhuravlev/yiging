name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, json, openssl
          tools: composer

      - run: npm install
      - run: composer install --working-dir=apps/api
      - run: composer install --working-dir=packages/yijing-core
      - run: npm run verify
